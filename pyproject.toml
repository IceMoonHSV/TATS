[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tats"
version = "2.0.0"
description = "Token Analysis and Tracking System (TATS) — track OAuth2 / JWT tokens across captured traffic from Burp XML, mitmproxy flow files, or live Chrome via DevTools Protocol, with a SQLite-backed dashboard tuned for Microsoft Entra ID."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "TATS contributors" },
]
keywords = [
    "tats", "burp", "oauth", "jwt", "entra", "azure", "microsoft",
    "foci", "broci", "naa", "mitmproxy", "cdp", "chrome",
    "pentest", "security", "websocket",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Log Analysis",
]
dependencies = []   # core paths use stdlib only

[project.optional-dependencies]
mitm = ["mitmproxy>=10.0"]
test = ["pytest>=7.0"]
all = ["mitmproxy>=10.0", "pytest>=7.0"]

[project.scripts]
tats = "tats:main_cli"

[project.urls]
Homepage = "https://github.com/tats/tats"
Issues = "https://github.com/tats/tats/issues"

[tool.setuptools]
packages = ["tats"]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
# Ship the dashboard's HTML / CSS / JS alongside the Python so a pip
# install picks them up. They're loaded once at module import time.
tats = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:mitmproxy.*",
]
