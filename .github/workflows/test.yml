name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Install the package with the optional dev extras: pytest, plus
      # mitmproxy so the WebSocket-ingest tests run instead of being
      # skipped (the mitm path is part of the core feature surface).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,mitm]"

      - name: Run pytest
        run: pytest -v
